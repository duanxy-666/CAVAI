[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civa"
version = "1.0.2"
description = "Evidence-driven CATIA verification, synthetic tabular reinforcement-learning triage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "CIVA contributors" }]
dependencies = []

[project.optional-dependencies]
catia = ["pycatia"]

[project.scripts]
civa = "civa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
